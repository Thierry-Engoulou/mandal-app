name: Android

on:
  push:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Construire l'APK de test
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mandal-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  essai:
    # Installe l'APK sur un émulateur Android et vérifie les parcours clés.
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mandal-android-apk
          path: apk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Playwright (sans navigateur)
        working-directory: mobile/tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Essai sur émulateur Android 14
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MANDAL_TEST_EMAIL: ${{ secrets.MANDAL_TEST_EMAIL }}
          MANDAL_TEST_PASSWORD: ${{ secrets.MANDAL_TEST_PASSWORD }}
          CAPTURES: ${{ github.workspace }}/captures
          ESSAI_STRICT: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            node mobile/tests/essai-android.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-essai-android
          path: captures
